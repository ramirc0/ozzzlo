[package]
name = "ozzzlo"
version = "0.0.0"
edition = "2024"
description = "Control Ozlo Sleepbuds from a Linux desktop"
license = "MIT"

[dependencies]
bluer = { version = "0.17", features = ["bluetoothd"] }
dbus = { version = "0.9", features = ["vendored"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
anyhow = "1"
jiff = "1"
log = { version = "0.4", features = ["std"] }

[profile.release]
debug = "line-tables-only"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
